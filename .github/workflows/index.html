<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game</title>
    <!-- Link to you.js -->
    <script src="scripts/you.js"></script>
</head>
<body style="margin:0; padding:0; overflow:hidden; background:#ffffff;">

    <!-- Start Screen -->
    <div id="start-screen" style="width:100vw; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#ffffff; position:absolute; top:0; left:0; z-index:9999;">
        
        <button id="verify-btn" onclick="verifyPopups()" style="display:block; padding:12px 28px; font-size:18px; font-weight:bold; cursor:pointer; border:1px solid #ccc; background:#f0f0f0; margin-top:15px;">Enable Pop-ups to Play</button>
        
        <div id="popup-guide" style="display:none; margin-top:20px; font-size:15px; color:#d9534f; max-width:420px; line-height:1.5; background:#fff0f0; padding:15px; border-radius:8px; border:1px solid #ffcccc;">
            <strong>Action Needed:</strong> Please click the pop-up icon in your address bar and select <strong>"Always allow pop-ups"</strong>, then press the button below!
        </div>
        
        <button id="start-btn" onclick="startPrank()" style="display:none; padding:12px 28px; font-size:18px; font-weight:bold; cursor:pointer; background-color:#4CAF50; color:white; border:none; margin-top:15px;">Start Game</button>
        
    </div>

    <!-- Media Container -->
    <div id="media-container" style="display:none; width:100vw; height:100vh; background:#ffffff; justify-content:center; align-items:center;">
        <img id="flash-img" src="flash.gif" alt="You are an idiot!" style="width:100%; height:100%; object-fit:contain; user-select:none;" onerror="this.src='flash.gif'" />
        <audio id="idiot-audio" src="idiot.mp3" loop></audio>
    </div>

    <script>
        // --- Phase 1: Verify (UI only) ---
        function verifyPopups() {
            window.open("about:blank", "blank_test_1", "width=300,height=200");
            window.open("about:blank", "blank_test_2", "width=300,height=200");
            document.getElementById('verify-btn').style.display = 'none';
            document.getElementById('popup-guide').style.display = 'block';
            document.getElementById('start-btn').style.display = 'inline-block';
        }
    </script>
</body>
</html>
